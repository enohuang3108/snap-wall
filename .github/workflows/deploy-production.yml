name: Deploy Production Environment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Run linter
      # run: pnpm lint

      # - name: Run type check
      # run: pnpm typecheck

      # - name: Run unit tests
      # run: pnpm test

      - name: Build Workers
        run: pnpm run build:workers

      - name: Deploy Workers API to Production
        run: pnpm run deploy:workers:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Frontend (Production)
        run: pnpm run build:production
        env:
          VITE_API_URL: https://snap-wall-api-production.oddlabcc.workers.dev
          VITE_WS_URL: wss://snap-wall-api-production.oddlabcc.workers.dev
          VITE_BACKEND_URL: https://snap-wall-api-production.oddlabcc.workers.dev

      - name: Deploy Frontend to Production
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### ✅ Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API**: https://snap-wall-api-production.oddlabcc.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend**: https://snap-wall.oddlabcc.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **請確認部署結果並進行測試**" >> $GITHUB_STEP_SUMMARY
